version: "3.9"

# Secrets come from a gitignored .env in this directory (compose auto-loads it):
#   POSTGRES_PASSWORD=<strong>
#   REDIS_PASSWORD=<strong>
# Ports bind to 127.0.0.1 only — Postgres/Redis are never exposed on the host's
# public interface (defense in depth on top of the security group).

services:
  postgres:
    image: postgres:16-alpine
    container_name: strykd_postgres
    environment:
      POSTGRES_USER: strykd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strykd}
      POSTGRES_DB: strykd
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strykd"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: strykd_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-}", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

volumes:
  postgres_data:
  redis_data:
